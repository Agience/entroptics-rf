[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entroptics-rf"

license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL_LICENSE.md", "PATENTS.md"]
version = "0.1.0"
description = "The RF signal is an entropy-matched screen. A seed-keyed optical aperture carries the payload in its coherent modes; the receiver reads the whole geometry from the capture itself. No FFT and no DSP anywhere in the path."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ikailo John Sessford", email = "john@ikailo.com" }]
keywords = ["rf", "waveform", "entroptics", "optics", "aperture", "modem", "blind-acquisition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications :: Ham Radio",
]

dependencies = [
    "numpy>=2.0",          # entroptics requires numpy 2.0 (numpy.linalg.svdvals); 2.0 is the real floor
    "entroptics>=0.2.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
test   = ["pytest>=8"]
# SDR hardware extras need system libraries; see https://github.com/Agience/entroptics-mesh/blob/main/research/PACKAGING.md (CPU-only install needs neither).
sdr    = ["pyadi-iio>=0.0.18"]   # Pluto/ADALM via libiio
rtlsdr = ["pyrtlsdr>=0.2.9"]     # RTL-SDR via librtlsdr; 0.2.9x is the current bench build (>=0.3 excludes it)

[project.scripts]
entroptics-rf = "entroptics_rf.__main__:main"

[project.urls]
Repository = "https://github.com/Agience/entroptics-rf"
Issues = "https://github.com/Agience/entroptics-rf/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["entroptics_rf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running test (blind/scale/coherent sweeps); skip with -m 'not slow'",
]
