name: ci
# Tests the PHY codec. entroptics (the core dep) is on PyPI, so this runs standalone.
# SDR extras (pyadi-iio / pyrtlsdr) need libiio / librtlsdr system libraries and are NOT
# installed here — CI covers the pure-software codec only.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (py ${{ matrix.python-version }}, reference path)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pytest-cov        # entroptics>=0.2.10 from PyPI
      - name: Test (ENTROPTICS_FAST=0, pure-Python reference) + coverage
        env:
          OPENBLAS_NUM_THREADS: "1"                  # the suite assumes one BLAS thread
          ENTROPTICS_FAST: "0"
        run: pytest -q -p no:cacheprovider -W ignore --cov=entroptics_rf --cov-report=term-missing

  compiled-kernels:
    name: compiled kernels (ENTROPTICS_FAST=1, numba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (+ numba for the compiled path)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" numba
      - name: Test (compiled _fast kernels; internal bit-identity gates must pass)
        env:
          OPENBLAS_NUM_THREADS: "1"
          ENTROPTICS_FAST: "1"
        run: pytest -q -p no:cacheprovider -W ignore
